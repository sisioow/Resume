name: Deploy China mirror to Gitee Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: gitee-pages
  cancel-in-progress: true

jobs:
  deploy-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Check Gitee secrets
        id: check
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 GITEE_TOKEN，跳过。见 docs/国内镜像说明.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "repo_name=${GITEE_REPO:-Resume}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        if: steps.check.outputs.configured == 'true'
        working-directory: site
        run: |
          npm install
          npm run build

      - name: Resolve Gitee user and push gh-pages
        if: steps.check.outputs.configured == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -euo pipefail

          # 用令牌解析真实用户名，避免 OWNER 填成 GitHub 名
          USER_JSON=$(curl -sS "https://gitee.com/api/v5/user?access_token=${GITEE_TOKEN}")
          LOGIN=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('login',''))" <<<"$USER_JSON")
          if [ -z "$LOGIN" ]; then
            echo "::error::令牌无效，无法读取 Gitee 用户。请重新创建私人令牌（勾选 projects）"
            echo "$USER_JSON"
            exit 1
          fi

          OWNER="${GITEE_OWNER:-$LOGIN}"
          REPO="${GITEE_REPO:-Resume}"
          if [ "$OWNER" != "$LOGIN" ]; then
            echo "::warning::Secret GITEE_OWNER=${OWNER} 与令牌用户 ${LOGIN} 不一致，改用令牌用户 ${LOGIN}"
            OWNER="$LOGIN"
          fi

          echo "Deploy target: https://gitee.com/${OWNER}/${REPO}"

          CODE=$(curl -sS -o /tmp/gitee-repo.json -w "%{http_code}" \
            "https://gitee.com/api/v5/repos/${OWNER}/${REPO}?access_token=${GITEE_TOKEN}")
          echo "GET repo HTTP $CODE"

          if [ "$CODE" != "200" ]; then
            echo "Creating public repo ${REPO}…"
            CREATE=$(curl -sS -o /tmp/gitee-create.json -w "%{http_code}" \
              -X POST "https://gitee.com/api/v5/user/repos" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"name\":\"${REPO}\",\"description\":\"施宏威个人作品集 · Gitee Pages\",\"private\":false,\"auto_init\":false}")
            echo "CREATE HTTP $CREATE"
            cat /tmp/gitee-create.json
            # 422 已存在：直接继续推送
            if [ "$CREATE" != "201" ] && [ "$CREATE" != "200" ]; then
              if ! grep -q '已存在' /tmp/gitee-create.json; then
                echo "::error::无法准备 Gitee 仓库"
                exit 1
              fi
              echo "Repo already exists, continue push."
            fi
          fi

          # 尽量设为公开（免费 Pages 需要）
          curl -sS -X PATCH "https://gitee.com/api/v5/repos/${OWNER}/${REPO}" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"private\":false}" >/tmp/gitee-patch.json || true

          cd site/dist
          rm -rf .git
          git init
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: gitee pages $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git branch -M gh-pages
          git remote add origin "https://${OWNER}:${GITEE_TOKEN}@gitee.com/${OWNER}/${REPO}.git"
          git push -f origin gh-pages

          echo ""
          echo "Push OK → https://gitee.com/${OWNER}/${REPO}"
          echo "请到 Gitee：服务 → Gitee Pages → 分支 gh-pages → 启动/更新"
          echo "预览地址：https://${OWNER}.gitee.io/${REPO}/"
