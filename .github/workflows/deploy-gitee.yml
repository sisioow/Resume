name: Deploy China mirror to Gitee Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: gitee-pages
  cancel-in-progress: true

jobs:
  deploy-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Check Gitee secrets
        id: check
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_OWNER" ] || [ -z "$GITEE_REPO" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 GITEE_* Secrets，跳过 Gitee 部署。见 docs/国内镜像说明.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        if: steps.check.outputs.configured == 'true'
        working-directory: site
        run: |
          npm install
          npm run build

      - name: Push dist to Gitee gh-pages
        if: steps.check.outputs.configured == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -euo pipefail
          cd site/dist
          git init
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: gitee pages $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git branch -M gh-pages
          git remote add origin "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git push -f origin gh-pages
          echo "Pushed to gitee.com/${GITEE_OWNER}/${GITEE_REPO} (gh-pages)"
          echo "Site (after enabling Pages): https://${GITEE_OWNER}.gitee.io/${GITEE_REPO}/"
