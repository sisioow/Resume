<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Research · 深度调研 Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wash" aria-hidden="true"></div>

  <header class="rail">
    <a class="back" href="../../">作品集</a>
    <div class="id">
      <span class="sig">调研</span>
      <strong>Deep Research 工作台</strong>
    </div>
    <div class="rail-right">
      <span id="phase" class="phase">待机</span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <section class="brief">
    <div class="brief-copy">
      <p class="kicker">deepseek-v4-pro · 真实多智能体情报台</p>
      <h1>拆解课题 · 交叉验证 · <em>带引用成稿</em></h1>
    </div>
    <div class="brief-form">
      <label>
        <span>调研课题</span>
        <textarea id="topic" rows="2" placeholder="输入你想调研的课题，例如：对比 A 与 B 在生产环境中的适用边界与选型建议"></textarea>
      </label>
      <div class="brief-row">
        <p class="brief-hint">课题将依次经过 规划 → 检索 → 裁决 → 成稿 四个智能体</p>
        <div class="brief-actions">
          <button type="button" class="go" id="run">开始调研</button>
          <button type="button" class="reset" id="reset">重置</button>
        </div>
      </div>
    </div>
  </section>

  <ol class="track" id="steps">
    <li data-step="plan"><b>01</b><span>规划</span></li>
    <li data-step="search"><b>02</b><span>检索</span></li>
    <li data-step="critic"><b>03</b><span>裁决</span></li>
    <li data-step="write"><b>04</b><span>成稿</span></li>
  </ol>

  <main class="desk">
    <aside class="evidence">
      <div class="ev-head">
        <h2>证据墙</h2>
        <span id="source-count">0 个信源</span>
      </div>
      <ul class="sources" id="sources"></ul>
      <div class="meters">
        <div><em id="m-sources">0</em><span>信源</span></div>
        <div><em id="m-conflicts">0</em><span>裁决</span></div>
        <div><em id="m-conf">—</em><span>置信</span></div>
        <div><em id="m-ms">—</em><span>耗时</span></div>
      </div>
    </aside>

    <section class="paper-wrap">
      <div class="paper-bar">
        <span>调研简报</span>
        <span class="badge" id="out-badge">待生成</span>
      </div>
      <article class="report" id="report">
        <p class="placeholder">输入课题并执行后，调研稿将在此纸面展开，引用编号与风险栏同步出现。</p>
      </article>
      <ol class="log" id="log"></ol>
    </section>
  </main>

  <script src="../_shared/llm.js"></script>
  <script src="./app.js"></script>
  <script>
    const clock = document.getElementById('clock')
    const tick = () => {
      const d = new Date()
      clock.textContent = d.toLocaleTimeString('en-GB', { hour12: false })
    }
    tick()
    setInterval(tick, 1000)
  </script>
</body>
</html>
