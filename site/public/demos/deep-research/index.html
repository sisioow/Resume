<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Research · 深度调研 Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="rail">
    <a class="back" href="../../">作品集</a>
    <div class="id">
      <span class="sig">INTEL</span>
      <strong>Deep Research Desk</strong>
    </div>
    <div class="rail-right">
      <span id="phase" class="phase">STANDBY</span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <section class="brief">
    <div class="brief-copy">
      <p class="kicker">多智能体情报台 · 非聊天 Demo</p>
      <h1>拆解课题 · 交叉验证 · <em>带引用成稿</em></h1>
    </div>
    <div class="brief-form">
      <label>
        <span>MISSION BRIEF</span>
        <textarea id="topic" rows="2">对比 LangGraph / CrewAI / AutoGen 在生产 Agent 中的适用边界与选型建议</textarea>
      </label>
      <div class="brief-row">
        <div class="presets" id="presets">
          <button type="button" data-id="framework">框架选型</button>
          <button type="button" data-id="pricing">竞品定价</button>
          <button type="button" data-id="mcp">MCP 生态</button>
        </div>
        <div class="brief-actions">
          <button type="button" class="go" id="run">EXECUTE</button>
          <button type="button" class="reset" id="reset">RESET</button>
        </div>
      </div>
    </div>
  </section>

  <ol class="track" id="steps">
    <li data-step="plan"><b>01</b><span>Planner</span></li>
    <li data-step="search"><b>02</b><span>Search</span></li>
    <li data-step="critic"><b>03</b><span>Critic</span></li>
    <li data-step="write"><b>04</b><span>Writer</span></li>
  </ol>

  <main class="desk">
    <aside class="evidence">
      <div class="ev-head">
        <h2>证据墙</h2>
        <span id="source-count">0 SRC</span>
      </div>
      <ul class="sources" id="sources"></ul>
      <div class="meters">
        <div><em id="m-sources">0</em><span>信源</span></div>
        <div><em id="m-conflicts">0</em><span>裁决</span></div>
        <div><em id="m-conf">—</em><span>置信</span></div>
        <div><em id="m-ms">—</em><span>耗时</span></div>
      </div>
    </aside>

    <section class="paper-wrap">
      <div class="paper-bar">
        <span>BRIEFING PAPER</span>
        <span class="badge" id="out-badge">DRAFT PENDING</span>
      </div>
      <article class="report" id="report">
        <p class="placeholder">执行后，情报稿将在此纸面展开，引用编号与风险栏同步出现。</p>
      </article>
      <ol class="log" id="log"></ol>
    </section>
  </main>

  <script src="./app.js"></script>
  <script>
    const clock = document.getElementById('clock')
    const tick = () => {
      const d = new Date()
      clock.textContent = d.toLocaleTimeString('en-GB', { hour12: false })
    }
    tick()
    setInterval(tick, 1000)
  </script>
</body>
</html>
