<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG知识库智能检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="home" href="../../">← 作品集</a>
      <div class="side-brand">
        <span class="logo">RAG</span>
        <div>
          <strong>RAG知识库智能检索</strong>
          <em>Hybrid · Rerank · deepseek-v4-pro</em>
        </div>
      </div>

      <p class="side-label">知识库</p>
      <div class="kb-list" id="kb-switch" role="tablist">
        <button type="button" class="is-active" data-kb="resume">
          <span class="dot"></span>
          <div>
            <strong>我的简历</strong>
            <em>默认 · 履历 / 项目 / 技能</em>
          </div>
        </button>
        <button type="button" data-kb="product">
          <span class="dot alt"></span>
          <div>
            <strong>产品手册</strong>
            <em>runtime / MCP / HITL</em>
          </div>
        </button>
        <button type="button" data-kb="support">
          <span class="dot"></span>
          <div>
            <strong>售后政策</strong>
            <em>SLA / 上传 / 私有化</em>
          </div>
        </button>
      </div>

      <p class="side-label">快捷问题</p>
      <div class="presets" id="presets"></div>

      <div class="side-metrics">
        <div><b id="m-hit">—</b><span>Hit@3</span></div>
        <div><b id="m-faith">—</b><span>忠实度</span></div>
        <div><b id="m-lat">—</b><span>延迟</span></div>
      </div>
    </aside>

    <section class="chat">
      <header class="chat-top">
        <div>
          <strong id="kb-title">我的简历</strong>
          <span class="online"><i></i> Agent online</span>
        </div>
        <div class="chat-actions">
          <span id="retrieve-state">待机</span>
          <button type="button" class="ghost" id="clear">清空会话</button>
        </div>
      </header>

      <div class="thread" id="thread">
        <div class="bubble bot welcome">
          <p>你好，这里是<strong>RAG知识库智能检索</strong>。默认知识库为「我的简历」——先混合检索切片并重排，再由 deepseek-v4-pro 生成带引用答复。也可切换示例产品 / 售后知识库。</p>
        </div>
      </div>

      <form class="composer" id="composer">
        <textarea id="question" rows="2" placeholder="例如：目前在做什么？代表作是什么？如何联系？"></textarea>
        <button type="submit" class="send" id="ask">发送</button>
      </form>
    </section>

    <aside class="inspector">
      <div class="insp-head">
        <h2>检索检视器</h2>
        <span class="badge" id="ans-badge">空闲</span>
      </div>
      <ul class="chunks" id="chunks">
        <li class="empty">提问后这里显示命中切片与分数</li>
      </ul>
      <div class="cites" id="cites"></div>
      <ol class="trace" id="trace"></ol>
    </aside>
  </div>

  <div id="answer" hidden></div>

  <script src="../_shared/llm.js"></script>
  <script src="./app.js"></script>
</body>
</html>
